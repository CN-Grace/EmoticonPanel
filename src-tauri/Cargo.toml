[package]
name = "emoticon-panel"
version = "0.1.0"
description = "仿微信表情面板 — 自定义表情包 (gif/png)"
edition = "2021"

[lib]
name = "emoticon_panel_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情面板</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- 表情网格 (上下滚动) + 表情包名 -->
      <div class="grid-wrap">
        <div class="grid-area" id="gridArea"></div>
        <div class="group-name" id="groupName"></div>
      </div>

      <!-- 底部栏: 分组 Tab + 商店 + 刷新 + attach 目标窗口 -->
      <div class="bottom-bar">
        <div class="tabs" id="tabs"></div>
        <button class="icon-btn shop-entry" id="shopBtn" title="表情商店">＋</button>
        <button class="icon-btn" id="refreshBtn" title="刷新表情包">⭮</button>
        <span class="tabs-spacer"></span>
        <button class="attach-btn" id="attachBtn" title="点击选择要插入表情的目标窗口">
          <span class="attach-ico">📌</span>
          <span class="attach-label" id="attachLabel">选择窗口</span>
        </button>
      </div>

      <!-- 悬浮大预览 -->
      <div class="preview" id="preview" hidden><img id="previewImg" alt="" /></div>

      <!-- 右键菜单 -->
      <div class="ctx-menu" id="ctxMenu" hidden></div>

      <!-- 商店浮层 -->
      <div class="shop-view" id="shopView" hidden>
        <div class="shop-head">
          <button class="icon-btn" id="shopBack">← 返回</button>
          <span class="shop-title">表情商店</span>
          <span></span>
        </div>
        <div class="shop-hint" id="shopHint"></div>
        <div class="shop-list" id="shopList"></div>
      </div>

      <!-- 确认弹窗 -->
      <div class="modal-mask" id="modalMask" hidden>
        <div class="modal">
          <div class="modal-text" id="modalText"></div>
          <div class="modal-btns">
            <button class="m-btn" id="modalCancel">取消</button>
            <button class="m-btn danger" id="modalOk">确认</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </body>
</html>

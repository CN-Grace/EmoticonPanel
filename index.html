<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情面板</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- 表情网格 (上下滚动), 每个表情下方显示图片名 -->
      <div class="grid-area" id="gridArea"></div>

      <!-- 底部栏: 表情包组 Tab (滚轮切换) + 设置 -->
      <div class="bottom-bar">
        <div class="tabs" id="tabs"></div>
        <button class="icon-btn gear" id="gearBtn" title="设置">⚙</button>
      </div>

      <!-- 设置面板 -->
      <div class="settings" id="settings" hidden>
        <div class="set-row" id="setTarget">
          <div class="set-label">目标窗口</div>
          <div class="set-value" id="setTargetVal">未选择</div>
          <button class="set-btn" id="setTargetBtn">选择</button>
        </div>
        <div class="set-row" id="setRefresh">
          <div class="set-label">刷新表情包</div>
          <div class="set-value dim">重新扫描分组</div>
          <button class="set-btn" id="setRefreshBtn">刷新</button>
        </div>
        <div class="set-row" id="setLocation">
          <div class="set-label">表情包位置</div>
          <div class="set-value dim" id="setLocationVal">-</div>
          <button class="set-btn" id="setLocationBtn">选择文件夹</button>
        </div>
        <div class="set-row" id="setFollow">
          <div class="set-label">跟随窗口</div>
          <div class="set-value dim" id="setFollowVal">关闭</div>
          <button class="set-btn" id="setFollowBtn">开启</button>
        </div>
      </div>

      <!-- 右键菜单 -->
      <div class="ctx-menu" id="ctxMenu" hidden></div>

      <!-- 确认弹窗 -->
      <div class="modal-mask" id="modalMask" hidden>
        <div class="modal">
          <div class="modal-text" id="modalText"></div>
          <div class="modal-btns">
            <button class="m-btn" id="modalCancel">取消</button>
            <button class="m-btn danger" id="modalOk">确认</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </body>
</html>
